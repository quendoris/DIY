name: DIY three-way baffle geometry study

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/diy-speakers/simulation/threeway_baffle_geometry.py"
      - "projects/diy-speakers/simulation/test_threeway_baffle_geometry.py"
      - "projects/diy-speakers/simulation/threeway_wave_desk_model.py"
      - "projects/diy-speakers/simulation/test_threeway_wave_desk_model.py"
      - "projects/diy-speakers/simulation/threeway_baffle_reference.scad"
      - ".github/workflows/threeway-geometry-study.yml"

permissions:
  contents: read

jobs:
  dimension-and-nearfield-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dimension boundaries and ideal head-window model
        working-directory: projects/diy-speakers/simulation
        run: python3 -m unittest -v test_threeway_baffle_geometry.py test_threeway_wave_desk_model.py
      - name: Reproduce factory-dimensioned panel study
        working-directory: projects/diy-speakers/simulation
        run: |
          mkdir -p analysis
          python3 threeway_baffle_geometry.py > analysis/threeway-baffle-model.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("analysis/threeway-baffle-model.json").read_text())
          print("REAL ACOUSTIC MEASUREMENT:",data["measured_acoustic_head_window"])
          print("CONDITIONALLY ROBUST GEOMETRY:",data["conditionally_most_robust_layout_id"])
          for row in data["layouts"]:
            print("LAYOUT:", row["id"])
            if not row["physical_rim_clearance_pass"]:
              print("  REJECTED:",row["reason"])
              continue
            p=row["tooling_panel"]
            a=row["ideal_model_head_window"]
            print("  panel(mm):", p["required_flat_panel_width_mm"],
                  p["required_flat_panel_height_mm"])
            print("  center x,y from lower-left (mm):",
                  p["center_xy_from_lower_left_mm"])
            print("  target ear-axis x,y(mm):",
                  p["nominal_ear_projection_from_lower_left_mm"])
            print("  min rim clearance(mm):", p["min_frame_clearance_mm"])
            print("  p95 abs change(dB):", a["percentile_95_abs_db"],
                  "max:", a["worst_case"],
                  "RMS:",a["rms_abs_db"])
            print("  y=+10cm z=70cm at 2.5kHz(dB):",
                  a["mid_high_2500hz_ear_up_10cm_70cm_db"])
          print("CAUTION:",data["warnings"][0])
          PY
      - name: Reproduce piston directivity + baffle edge paths + illustrative table reflections
        working-directory: projects/diy-speakers/simulation
        run: |
          python3 threeway_wave_desk_model.py > analysis/threeway-wave-desk.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("analysis/threeway-wave-desk.json").read_text())
          print("PHYSICALLY MEASURED:",j["actual_speaker_measurements"])
          print("WAVE EQ DIFFRACTION SOLVED:",j["wave_eq_finite_baffle_diffraction_solved"])
          print("PISTON IDEAL SPL ANGULAR ATTENUATION:")
          for n,v in j["ideal_farfield_piston_examples"].items():
              print(n,v)
          for x in j["layout_hypotheses"]:
              if x["layout"] not in ("A_minimum_practical_vertical","F_side_LOW_left",
                                    "G_side_LOW_right","E_wide_gaps_vertical"): continue
              print("LAYOUT",x["layout"],"PANEL",x["panel_mm"])
              print("DESK ALIGNMENT",x["nominal_ear_height_table_setup"])
              print("POINT WINDOW",x["monopole_head_window"])
              print("PISTON WINDOW",x["ideal_piston_head_window"])
              for k in ("LOW","MID","HIGH"):
                  if k in x["ideal_infinite_table_image_source_examples"]:
                      print("DESK",k,x["ideal_infinite_table_image_source_examples"][k])
          PY
      - name: Archive derived geometry model without proprietary vendor PDFs
        uses: actions/upload-artifact@v4
        with:
          name: threeway-geometric-window
          path: projects/diy-speakers/simulation/analysis/*.json
          if-no-files-found: error
